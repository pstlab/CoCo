[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coco"
version = "1.0.0"
dependencies = [
    "requests>=2.34.2",
    "websocket-client>=1.9.0"
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests"
]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"